<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1b26">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>¿Que barrio es este ve?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1b26;
    color: #c0caf5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #24283b;
    border-radius: 20px;
    padding: 40px 30px;
    text-align: center;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .barrio-name {
    font-size: 32px;
    font-weight: 700;
    color: #7aa2f7;
    margin: 20px 0 8px;
    line-height: 1.2;
  }
  .comuna-name {
    font-size: 18px;
    color: #565f89;
    margin-bottom: 24px;
  }
  .coords {
    font-size: 13px;
    color: #414868;
    font-family: 'SF Mono', 'Fira Code', monospace;
    margin-bottom: 20px;
  }
  .status {
    font-size: 16px;
    color: #9ece6a;
    margin: 16px 0;
  }
  .status.error { color: #f7768e; }
  .status.loading { color: #e0af68; }
  .btn {
    background: #7aa2f7;
    color: #1a1b26;
    border: none;
    border-radius: 12px;
    padding: 14px 32px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 16px;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.7; }
  .btn:disabled { background: #414868; cursor: not-allowed; }
  .icon { font-size: 48px; margin-bottom: 8px; }
  .accuracy {
    font-size: 12px;
    color: #414868;
    margin-top: 8px;
  }
  .nearby {
    margin-top: 20px;
    text-align: left;
    border-top: 1px solid #2a2a3a;
    padding-top: 16px;
  }
  .nearby-title {
    font-size: 14px;
    color: #565f89;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .nearby-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #1a1b26;
  }
  .nearby-name {
    font-size: 15px;
    color: #c0caf5;
  }
  .nearby-dist {
    font-size: 13px;
    color: #7aa2f7;
    font-family: 'SF Mono', 'Fira Code', monospace;
    white-space: nowrap;
    margin-left: 12px;
  }
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #414868;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon" id="icon">📍</div>
  <div class="barrio-name" id="barrio">¿Que barrio es este ve?</div>
  <div class="comuna-name" id="comuna">Esperando GPS...</div>
  <div class="coords" id="coords"></div>
  <div class="status" id="status"></div>
  <button class="btn" id="detectBtn" onclick="startTracking()">Iniciar rastreo</button>
  <div class="accuracy" id="accuracy"></div>
  <div class="nearby" id="nearby" style="display:none">
    <div class="nearby-title">Barrios cercanos</div>
    <div id="nearbyList"></div>
  </div>
</div>
<div class="footer">¿Que barrio es este ve? | 331 barrios de Cali | Datos: OpenStreetMap</div>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script>
let barrios = null;

async function loadBarrios() {
  const status = document.getElementById('status');
  status.className = 'status loading';
  status.textContent = 'Cargando barrios...';

  try {
    const resp = await fetch('barrios.geojson');
    barrios = await resp.json();
    status.className = 'status';
    status.textContent = `${barrios.features.length} barrios cargados`;
  } catch (e) {
    status.className = 'status error';
    status.textContent = 'Error cargando barrios: ' + e.message;
  }
}

function findBarrio(lat, lng) {
  if (!barrios) return { current: null, nearby: [] };
  const point = turf.point([lng, lat]);
  let current = null;

  // Calculate distance to all barrios
  const distances = [];
  for (const feature of barrios.features) {
    try {
      const centroid = turf.centroid(feature);
      const dist = turf.distance(point, centroid, { units: 'meters' });
      const isInside = turf.booleanPointInPolygon(point, feature);

      if (isInside && !current) {
        current = feature.properties;
      }

      distances.push({
        name: feature.properties.name,
        comuna: feature.properties.comuna || '',
        distance: Math.round(dist),
        isInside
      });
    } catch (e) {
      continue;
    }
  }

  distances.sort((a, b) => a.distance - b.distance);

  // If no exact match, use nearest as approximate
  if (!current && distances.length > 0) {
    const n = distances[0];
    current = { name: n.name, comuna: n.comuna, approximate: true, distance: n.distance };
  }

  // Get 5 nearest that are NOT the current barrio
  const currentName = current ? current.name : '';
  const nearby = distances
    .filter(d => d.name !== currentName)
    .slice(0, 5);

  return { current, nearby };
}

let watchId = null;
let tracking = false;

function updateUI(pos) {
  const { latitude, longitude, accuracy } = pos.coords;
  const status = document.getElementById('status');
  const barrioEl = document.getElementById('barrio');
  const comunaEl = document.getElementById('comuna');
  const coordsEl = document.getElementById('coords');
  const iconEl = document.getElementById('icon');
  const accuracyEl = document.getElementById('accuracy');
  const nearbyEl = document.getElementById('nearby');
  const nearbyList = document.getElementById('nearbyList');

  coordsEl.textContent = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
  accuracyEl.textContent = `Precision: ${Math.round(accuracy)}m`;

  if (!barrios) return;

  const { current, nearby } = findBarrio(latitude, longitude);

  if (current) {
    if (current.approximate) {
      barrioEl.textContent = `~${current.name}`;
      comunaEl.textContent = current.comuna || 'Cerca (~' + current.distance + 'm)';
      status.className = 'status loading';
      status.textContent = 'Barrio aproximado';
      iconEl.textContent = '📍';
    } else {
      barrioEl.textContent = current.name;
      comunaEl.textContent = current.comuna || 'Cali';
      status.className = 'status';
      status.textContent = 'En tiempo real';
      iconEl.textContent = '✅';
    }
  } else {
    barrioEl.textContent = 'No encontrado';
    comunaEl.textContent = 'Puede que no estes en Cali';
    status.className = 'status error';
    status.textContent = 'Fuera del area de cobertura';
    iconEl.textContent = '❌';
  }

  if (nearby.length > 0) {
    nearbyEl.style.display = 'block';
    nearbyList.innerHTML = nearby.map(b => {
      const dist = b.distance < 1000
        ? `${b.distance}m`
        : `${(b.distance / 1000).toFixed(1)}km`;
      return `<div class="nearby-item">
        <span class="nearby-name">${b.name}</span>
        <span class="nearby-dist">${dist}</span>
      </div>`;
    }).join('');
  }
}

async function startTracking() {
  const btn = document.getElementById('detectBtn');
  const status = document.getElementById('status');
  const iconEl = document.getElementById('icon');

  if (tracking) {
    navigator.geolocation.clearWatch(watchId);
    tracking = false;
    btn.textContent = 'Iniciar rastreo';
    status.className = 'status';
    status.textContent = 'Rastreo detenido';
    iconEl.textContent = '📍';
    return;
  }

  if (!barrios) {
    await loadBarrios();
    if (!barrios) return;
  }

  if (!navigator.geolocation) {
    status.className = 'status error';
    status.textContent = 'GPS no disponible';
    return;
  }

  status.className = 'status loading';
  status.textContent = 'Conectando GPS...';
  iconEl.textContent = '🔄';
  btn.textContent = 'Detener';
  tracking = true;

  watchId = navigator.geolocation.watchPosition(
    updateUI,
    (err) => {
      status.className = 'status error';
      status.textContent = err.code === 1 ? 'Permiso GPS denegado' :
                          err.code === 2 ? 'GPS no disponible' :
                          'Timeout GPS';
      iconEl.textContent = '❌';
      tracking = false;
      btn.textContent = 'Iniciar rastreo';
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 2000 }
  );
}

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Preload barrios and auto-start tracking
loadBarrios().then(() => startTracking());
</script>
</body>
</html>
